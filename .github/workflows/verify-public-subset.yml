name: Verify published research artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research artifacts
        uses: actions/checkout@v4
      - name: Check published file SHA-256 values and manifest coverage
        run: python3 verify_public_subset.py
      - name: Recompute primary graph-level results
        run: python3 00_START_HERE/verify_public_graph_results.py
